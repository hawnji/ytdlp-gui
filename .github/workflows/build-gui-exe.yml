name: Build yt-dlp GUI.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp, dependencies, Deno and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install "yt-dlp[default,deno]" pyinstaller

      - name: Build the .exe
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "yt-dlp GUI" --distpath App --workpath .build --specpath .build
          ytdlp_gui.py

      - name: Add Deno and FFmpeg next to the .exe
        shell: pwsh
        run: |
          $prefix = python -c "import sys; print(sys.prefix)"
          $deno = Get-ChildItem -Path $prefix -Recurse -Filter deno.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($deno) { Copy-Item $deno.FullName App\ } else { Write-Warning "deno.exe not found" }
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ff
          Get-ChildItem ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination App\
          Get-ChildItem App

      - name: Zip it
        shell: pwsh
        run: Compress-Archive -Path App\* -DestinationPath "yt-dlp-GUI-windows.zip"

      - name: Publish as a release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "build-${{ github.run_number }}"
          gh release create $tag "yt-dlp-GUI-windows.zip" --title "yt-dlp GUI (build ${{ github.run_number }})" --notes "Unzip and run 'yt-dlp GUI.exe'. Keep ffmpeg.exe, ffprobe.exe and deno.exe in the same folder." --latest
