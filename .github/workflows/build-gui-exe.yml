name: Build yt-dlp GUI.exe

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    # Every Monday ~03:17 Pacific: rebuild with the newest yt-dlp (skipped if nothing changed)
    - cron: '17 11 * * 1'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history and tags, for patch notes and tag clean-up

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp, dependencies, Deno and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade "yt-dlp[default,deno,curl-cffi]" tkinterdnd2 pyinstaller

      - name: Check whether anything changed since the last release
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = python -c "import yt_dlp.version as v; print(v.__version__)"
          "ytdlp=$ver" >> $env:GITHUB_OUTPUT
          $skip = 'false'
          # A push that only touches docs/tooling (README, patch-note data, other workflows) is not a new app version
          if ('${{ github.event_name }}' -eq 'push') {
            $prevNotes = (gh release view --json body --jq .body 2>$null) -join "`n"
            $m = [regex]::Match($prevNotes, 'commit:\s*([0-9a-f]{40})')
            if ($m.Success) {
              $changed = git diff --name-only $m.Groups[1].Value '${{ github.sha }}'
              $appFiles = $changed | Where-Object { $_ -match '^(ytdlp_gui\.pyw?|build_exe\.bat)$' }
              if ($changed -and -not $appFiles) {
                $skip = 'true'
                Write-Host "Only non-app files changed since the last release - no new release:"
                $changed | ForEach-Object { Write-Host "  $_" }
              }
            }
          }
          if ('${{ github.event_name }}' -eq 'schedule') {
            $notes = gh release view --json body --jq .body 2>$null
            if ($notes -match [regex]::Escape("yt-dlp: $ver") -and $notes -match '${{ github.sha }}') {
              $skip = 'true'
              Write-Host "yt-dlp $ver and the app code are unchanged since the last release - nothing to do."
            }
          }
          "skip=$skip" >> $env:GITHUB_OUTPUT

      - name: Record build info inside the app
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          @"
          BUILD = ${{ github.run_number }}
          BUILT_YTDLP = '${{ steps.check.outputs.ytdlp }}'
          COMMIT = '${{ github.sha }}'
          "@ | Set-Content -Encoding utf8 _build_info.py

      - name: Build the .exe
        if: steps.check.outputs.skip != 'true'
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name "yt-dlp GUI" --distpath App --workpath .build --specpath .build
          --paths . --hidden-import _build_info --collect-all tkinterdnd2
          ytdlp_gui.py

      - name: Add Deno and FFmpeg next to the .exe
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: |
          $prefix = python -c "import sys; print(sys.prefix)"
          $deno = Get-ChildItem -Path $prefix -Recurse -Filter deno.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($deno) { Copy-Item $deno.FullName App\ } else { Write-Warning "deno.exe not found" }
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ff
          Get-ChildItem ff -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination App\
          Get-ChildItem App

      - name: Zip it
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        run: Compress-Archive -Path App\* -DestinationPath "yt-dlp-GUI-windows.zip"

      - name: Add patch notes to older releases that don't have any
        if: steps.check.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/backfill_notes.py

      - name: Write patch notes
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view --json body --jq .body > previous_notes.md 2>$null
          if ($LASTEXITCODE -ne 0) { Set-Content previous_notes.md '' }
          python .github/release_notes.py previous_notes.md "${{ steps.check.outputs.ytdlp }}" "${{ github.sha }}" "${{ github.run_number }}" > notes.md
          Get-Content notes.md

      - name: Publish as a release
        if: steps.check.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $n = [int]"${{ github.run_number }}"
          $tag = 'build-{0:D4}' -f $n
          gh release create $tag "yt-dlp-GUI-windows.zip" --target "${{ github.sha }}" --title "yt-dlp GUI (build $n)" --notes-file notes.md --latest
